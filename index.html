<!doctype html>
<html lang="en">
  <!-- Perubahan: Lang set ke en -->
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- UI Change: Title -->
    <title>BeatLight.js - Music Flashlight</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        background-color: #222;
        color: white;
        margin: 0;
      }
      button {
        padding: 15px 30px;
        font-size: 18px;
        background-color: #4caf50;
        color: white;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        margin-bottom: 20px;
        transition: background-color 0.3s;
      }
      button:hover {
        background-color: #45a049;
      }
      #status {
        font-size: 16px;
        color: #ccc;
        text-align: center;
        padding: 0 20px;
      }
      .kontrol-container {
        margin-top: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        width: 80%;
        max-width: 400px;
      }
      .kontrol-container label {
        font-size: 16px;
        color: #ccc;
        margin-bottom: 15px;
      }
      .kontrol-grup {
        display: flex;
        align-items: center;
        width: 100%;
        justify-content: center;
        gap: 10px;
      }
      #sliderSuara {
        flex-grow: 1;
        cursor: pointer;
      }
      #angkaSuara {
        width: 60px;
        padding: 8px;
        font-size: 16px;
        border: 1px solid #555;
        border-radius: 4px;
        background-color: #333;
        color: white;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <h2>BeatLight.js</h2>
    <!-- UI Change: Button Text -->
    <button id="tombolMulai">Start Music Light</button>

    <!-- UI Change: Instructions -->
    <div id="status">
      Press the button to start. Please allow camera and microphone access.
    </div>

    <div class="kontrol-container">
      <!-- UI Change: Label -->
      <label for="sliderSuara">Sound Sensitivity (0 - 255)</label>
      <div class="kontrol-grup">
        <input type="range" id="sliderSuara" min="0" max="255" value="10" />
        <input type="number" id="angkaSuara" min="0" max="255" value="10" />
      </div>
    </div>

    <script>
      const tombolMulai = document.getElementById("tombolMulai");
      const teksStatus = document.getElementById("status");
      const sliderSuara = document.getElementById("sliderSuara");
      const angkaSuara = document.getElementById("angkaSuara");

      let sedangBerjalan = false;
      let jalurKamera = null;
      let konteksAudio = null;
      let IDAnimasi = null;
      let BATAS_BASS = parseInt(sliderSuara.value);

      function perbaruiSensitivitas() {
        BATAS_BASS = parseInt(this.value);
        sliderSuara.value = this.value;
        angkaSuara.value = this.value;
      }

      sliderSuara.addEventListener("input", perbaruiSensitivitas);
      angkaSuara.addEventListener("input", perbaruiSensitivitas);

      tombolMulai.addEventListener("click", async () => {
        if (!sedangBerjalan) {
          await mulaiAplikasi();
        } else {
          berhentikanAplikasi();
        }
      });

      async function mulaiAplikasi() {
        try {
          // JS UI Change: Status Loading
          teksStatus.innerText = "Asking for permission...";

          const streamKamera = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: "environment" },
          });

          jalurKamera = streamKamera.getVideoTracks()[0];

          const streamAudio = await navigator.mediaDevices.getUserMedia({
            audio: true,
          });

          konteksAudio = new (
            window.AudioContext || window.webkitAudioContext
          )();
          const sumberAudio = konteksAudio.createMediaStreamSource(streamAudio);
          const penganalisis = konteksAudio.createAnalyser();

          penganalisis.fftSize = 256;
          sumberAudio.connect(penganalisis);

          const panjangData = penganalisis.frequencyBinCount;
          const dataKekuatanSuara = new Uint8Array(panjangData);

          sedangBerjalan = true;
          // JS UI Change: Button Stop
          tombolMulai.innerText = "Stop";
          tombolMulai.style.backgroundColor = "#f44336";
          // JS UI Change: Status Listening
          teksStatus.innerText = "Listening to music... Play loud music!";

          function cekSuara() {
            if (!sedangBerjalan) return;
            penganalisis.getByteFrequencyData(dataKekuatanSuara);
            let nilaiSuara = dataKekuatanSuara[1];
            try {
              if (nilaiSuara > BATAS_BASS) {
                jalurKamera.applyConstraints({ advanced: [{ torch: true }] });
              } else {
                jalurKamera.applyConstraints({ advanced: [{ torch: false }] });
              }
            } catch (err) {
              console.error("Flashlight control failed:", err);
            }
            IDAnimasi = requestAnimationFrame(cekSuara);
          }
          cekSuara();
        } catch (error) {
          console.error("Error:", error);
          // JS UI Change: Error Message
          teksStatus.innerText =
            "Failed to start. Please check permissions and use HTTPS connection.";
        }
      }

      function berhentikanAplikasi() {
        sedangBerjalan = false;
        // JS UI Change: Button Reset
        tombolMulai.innerText = "Start Music Light";
        tombolMulai.style.backgroundColor = "#4CAF50";
        // JS UI Change: Status Stopped
        teksStatus.innerText = "Music light stopped.";

        if (IDAnimasi) cancelAnimationFrame(IDAnimasi);

        if (jalurKamera) {
          try {
            jalurKamera.applyConstraints({ advanced: [{ torch: false }] });
          } catch (err) {}
          jalurKamera.stop();
        }

        if (konteksAudio) {
          konteksAudio.close();
        }
      }
    </script>
  </body>
</html>
